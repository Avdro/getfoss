name: Update Pre-release Builds

on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "src/data/prereleases/software.json"
      - "scripts/update-prereleases.mjs"
      - ".github/workflows/update-prereleases.yml"

permissions:
  contents: write

concurrency:
  group: update-prereleases
  cancel-in-progress: false

jobs:
  update-prereleases:
    name: Update Pre-release Catalogue
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update pre-release data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-prereleases.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/prereleases/releases.json
          if git diff --cached --quiet; then
            echo "No pre-release data changes."
          else
            git commit -m "chore: update pre-release builds"
            git push
          fi
