media:
  - name: images
    label: Images
    input: static/images
    output: /getfoss/images
    categories:
      - image
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - gif

content:
  - name: posts
    label: Posts
    type: collection
    path: content/posts
    subfolders: false
    filename: "{primary}.md"

    view:
      primary: title
      sort: date
      order: desc

    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: date
        label: Date
        type: date
        required: true

      - name: draft
        label: Draft
        type: boolean
        default: false

      - name: description
        label: Description
        type: text

      - name: categories
        label: Category
        type: select
        required: true
        options:
          multiple: false
          values:
            - Linux & BSD
            - Security & Privacy
            - Audio & Video
            - Graphics & Design
            - Engineering & CAD
            - Office & Productivity
            - Disk & Data
            - Finance
            - Development
            - System Tools
            - Networking & Internet
            - Other

      - name: tags
        label: Tags
        type: string
        list:
          separator: ","

      - name: cover
        label: Cover
        type: object
        fields:
          - name: image
            label: Image
            type: image
            options:
              media: images
              path: posts

          - name: alt
            label: Alt
            type: string

          - name: caption
            label: Caption
            type: string

      - name: body
        label: Content
        type: rich-text
        options:
          format: markdown
          media: images
          path: posts
