baseURL: "https://avdro.github.io/getfoss/"
locale: "en-us"

title: "GetFOSS — Open Source Software, Linux & Privacy"

description: "GetFOSS is an independent publication about open source software, Linux, privacy, security, and digital freedom. Discover useful applications, practical guides, open source projects, and tools that give you more control over your technology."

author: "GetFOSS"

enableRobotsTXT: true

buildDrafts: false
buildFuture: false
buildExpired: false

pagination:
  pagerSize: 10

module:
  imports:
    - path: github.com/adityatelange/hugo-PaperMod

taxonomies:
  category: categories
  tag: tags

sitemap:
  filename: sitemap.xml
  changeFreq: weekly
  priority: 0.5

outputs:
  home:
    - HTML
    - RSS
    - JSON

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production

  title: "GetFOSS — Open Source Software, Linux & Privacy"

  description: "GetFOSS is an independent publication about open source software, Linux, privacy, security, and digital freedom. Discover useful applications, practical guides, open source projects, and tools that give you more control over your technology."

  author: "GetFOSS"

  label:
    text: "GetFOSS"

  keywords:
    - open source software
    - free software
    - FOSS
    - Linux
    - open source applications
    - open source tools
    - privacy
    - security
    - digital freedom
    - self-hosting

  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowToc: true
  ShowCodeCopyButtons: true

  disableSpecial1stPost: false
  hidemeta: false
  hideSummary: false

  homeInfoParams:
    Title: "Open Source Software, Linux & Digital Freedom"
    Content: "Discover useful open source applications, practical guides, privacy-focused tools, Linux software, and projects that give you more control over your technology."

  assets:
    disableHLJS: false
    disableFingerprinting: false

menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 10

    - identifier: categories
      name: Categories
      url: /categories/
      weight: 20

    - identifier: tags
      name: Tags
      url: /tags/
      weight: 30

    - identifier: about
      name: About
      url: /about/
      weight: 40
